[package]
name = "bluearchive-rio"
version = "0.1.0"
edition = "2024"

[dependencies]
# GPUI is published as weekly snapshots of Zed (gpui-pre); any snapshot may change its API, so the
# version is pinned exactly, at the one Aoi (bluearchive-aoi) draws its window with.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11" }
anyhow = "1"
futures = "0.3"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
include_dir = "0.7.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9"

[target."cfg(windows)".dependencies]
windows-capture = "1.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

# Reading tests decode and scan whole screenshots; unoptimized they crawl. No incremental
# history and no debug info for the dependencies: in Aoi they piled up to 109GB in
# target/debug (2026-10-14); panics keep their line numbers.
[profile.dev]
opt-level = 2
incremental = false
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
strip = true

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
